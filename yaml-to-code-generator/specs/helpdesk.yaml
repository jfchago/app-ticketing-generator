# helpdesk.yaml — Domain specification for the Mini HelpDesk application
# This YAML is the SINGLE SOURCE OF TRUTH.
# All code (Vue, Spring, PUML) is generated from this file.

version: '1.0.0'

application:
  name: 'Mini HelpDesk'
  module: helpdesk
  description: 'A minimal support ticket management system'
  basePackage: com.helpdesk

# ── Enums ──────────────────────────────────────────────────────────────

enums:
  TicketStatus:
    values:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
    labels:
      OPEN: 'Abierta'
      IN_PROGRESS: 'En curso'
      RESOLVED: 'Resuelta'
      CLOSED: 'Cerrada'
    colors:
      OPEN: { bg: '#d4f5e0', text: '#0f3b21' }
      IN_PROGRESS: { bg: '#fef3cd', text: '#5c4000' }
      RESOLVED: { bg: '#d4edda', text: '#14532d' }
      CLOSED: { bg: '#e9ecef', text: '#364153' }

  TicketPriority:
    values:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
    labels:
      LOW: 'Baja'
      MEDIUM: 'Media'
      HIGH: 'Alta'
      URGENT: 'Urgente'
    colors:
      LOW: { bg: '#d4edda', text: '#14532d' }
      MEDIUM: { bg: '#d4f5e0', text: '#0f3b21' }
      HIGH: { bg: '#fef3cd', text: '#5c4000' }
      URGENT: { bg: '#f8d7da', text: '#7f1d1d' }

# ── Entities ───────────────────────────────────────────────────────────

entities:
  - name: Ticket
    stereotype: aggregate_root
    table: tickets
    description: 'Support ticket — the central aggregate'
    attributes:
      - name: id
        type: String
        required: true
        primary: true
        length: 36
      - name: title
        type: String
        required: true
        length: 200
        unique: true
        label: 'Title'
      - name: description
        type: String
        required: false
        length: 4000
        label: 'Description'
      - name: status
        type: TicketStatus
        required: true
        default: 'OPEN'
        label: 'Status'
      - name: priority
        type: TicketPriority
        required: true
        default: 'MEDIUM'
        label: 'Priority'
      - name: assigneeId
        type: String
        required: false
        length: 36
        label: 'Assignee'
      - name: createdAt
        type: DateTime
        required: true
      - name: updatedAt
        type: DateTime
        required: false
    relationships:
      - name: assignee
        type: many_to_one
        target: User
        foreign_key: assigneeId
        source_cardinality: '0..*'
        target_cardinality: '0..1'
      - name: comments
        type: one_to_many
        target: Comment
        foreign_key: ticketId
        source_cardinality: 1
        target_cardinality: '0..*'
      - name: activityLogs
        type: one_to_many
        target: ActivityLog
        foreign_key: ticketId
        source_cardinality: 1
        target_cardinality: '0..*'
    use_cases:
      - get_all
      - get_by_id
      - create
      - update_status
      - update_priority
      - assign_user
      - unassign_user
      - add_comment
      - get_history
    transitions:
      OPEN: [IN_PROGRESS, CLOSED]
      IN_PROGRESS: [RESOLVED, OPEN]
      RESOLVED: [CLOSED, IN_PROGRESS]
      CLOSED: [OPEN]
    rules:
      - name: RequiereComentarioParaCerrar
        on: update_status
        guard: "newStatus !== 'CLOSED' || entity.comments.length > 0"
        message: 'Requiere al menos un comentario para cerrar'
      - name: TituloObligatorio
        on: create
        guard: 'title.trim().length > 0'
        message: 'El título no puede estar vacío'
      - name: PrioridadValida
        on: update_priority
        guard: "newPriority !== 'LOW' || entity.priority !== 'LOW'"
        message: 'La prioridad ya es LOW'

  - name: User
    stereotype: entity
    table: users
    description: 'HelpDesk user (agent or reporter)'
    attributes:
      - name: id
        type: String
        required: true
        primary: true
        length: 36
        column: id
      - name: name
        type: String
        required: true
        length: 100
      - name: avatar
        type: String
        required: false
        length: 10
      - name: role
        type: String
        required: true
        length: 20
    relationships: []
    use_cases:
      - load_users
      - get_by_id

  - name: Comment
    stereotype: entity
    table: comments
    description: 'Comment attached to a ticket'
    attributes:
      - name: id
        type: String
        required: true
        primary: true
        length: 36
      - name: ticketId
        type: String
        required: true
        length: 36
      - name: text
        type: String
        required: true
        length: 2000
      - name: authorId
        type: String
        required: true
        length: 36
      - name: createdAt
        type: DateTime
        required: true
    relationships:
      - name: ticket
        type: many_to_one
        target: Ticket
        foreign_key: ticketId
        source_cardinality: '0..*'
        target_cardinality: '1'
      - name: author
        type: many_to_one
        target: User
        foreign_key: authorId
        source_cardinality: '0..*'
        target_cardinality: '0..1'
    use_cases: []

  - name: ActivityLog
    stereotype: entity
    table: activity_logs
    description: 'Audit log entry recording changes to tickets'
    attributes:
      - name: id
        type: String
        required: true
        primary: true
        length: 36
      - name: ticketId
        type: String
        required: true
        length: 36
      - name: actionType
        type: String
        required: true
        length: 50
      - name: actorId
        type: String
        required: true
        length: 36
      - name: actorName
        type: String
        required: false
        length: 100
      - name: fieldName
        type: String
        required: false
        length: 100
      - name: oldValue
        type: String
        required: false
        length: 4000
      - name: newValue
        type: String
        required: false
        length: 4000
      - name: description
        type: String
        required: false
        length: 2000
      - name: createdAt
        type: DateTime
        required: true
    relationships:
      - name: ticket
        type: many_to_one
        target: Ticket
        foreign_key: ticketId
        source_cardinality: '0..*'
        target_cardinality: '1'
    use_cases:
      - get_by_id

# ── Workflows (top-level) ────────────────────────────────────────────
# Orquestación multi-entidad con if/else, await, after timers

workflows:
  # Workflow principal: creación, asignación, resolución, escalamiento y cierre
  - 'workflow GestionTicket {
    actor Usuario;
    actor Admin;
    actor Tecnico;
    actor Supervisor;
    start -> ValidarTicket;
    step ValidarTicket: "Validar datos del ticket" {
    Usuario does crearTicket;
    if prioridadUrgente {
    System does notificarAdmin;
    Admin does asignarPrioritario;
    } else {
    System does encolarTicket;
    }
    }
    step AsignarTecnico: "Asignar a técnico disponible" {
    Admin does asignarTecnico;
    System does notificarAsignacion;
    after 4h {
    System does notificarAdmin;
    Admin does reasignar;
    }
    }
    step Investigar: "Investigar el problema" {
    Tecnico does investigar;
    if necesitaInfo {
    System does solicitarInfo;
    }
    }
    step EsperarRespuesta: "Esperar respuesta del usuario" {
    await UsuarioResponde;
    }
    step Resolver: "Resolver el ticket" {
    Tecnico does resolver;
    System does notificarResolucion;
    after 48h {
    System does recordarUsuario;
    }
    }
    step VerificarCierre: "Usuario verifica la resolución" {
    if usuarioConforme {
    Usuario does cerrarTicket;
    System does notificarCierre;
    } else {
    Usuario does reabrirTicket;
    System does notificarReapertura;
    }
    }
    step Escalar: "Escalar a supervisor si no se cierra" {
    after 72h {
    System does notificarSupervisor;
    Supervisor does revisarTicket;
    }
    }
    end Escalar;
    }'
  # Workflow de aprobación con tarea humana y timeout
  - 'workflow SolicitudCambio {
    actor Cliente;
    actor Manager;
    start -> Solicitar;
    step Solicitar: "Cliente solicita un cambio" {
    Cliente does enviarSolicitud;
    System does notificarManager;
    }
    step Revisar: "Manager revisa la solicitud" {
    await ManagerAprueba;
    after 24h {
    System does escalarRecordatorio;
    }
    if aprobada {
    System does notificarAprobacion;
    Cliente does confirmar;
    } else {
    System does notificarRechazo;
    Cliente does revisarFeedback;
    }
    }
    end Revisar;
    }'
  # Workflow de auto-cierre por inactividad
  - 'workflow AutoCierre {
    actor Sistema;
    start -> EsperarActividad;
    step EsperarActividad: "Esperar actividad del usuario" {
    after 7d {
    Sistema does notificarUsuario;
    Sistema does cerrarTicket;
    }
    await UsuarioResponde;
    Sistema does mantenerAbierto;
    }
    end EsperarActividad;
    }'

# ── Events (top-level) ─────────────────────────────────────────────
# Eventos entre componentes + eventos usados por await en workflows

events:
  - 'event TicketCreado {
    source: Ticket;
    payload {
    id: String;
    titulo: String;
    prioridad: String;
    }
    trackedFields: [title, status, priority];
    handlers: [ DashboardService, EmailService ];
    }'
  - 'event TicketAsignado {
    source: Ticket;
    payload {
    id: String;
    asignadoId: String;
    asignadoNombre: String;
    }
    trackedFields: [assignee];
    handlers: [ EmailService ];
    }'
  - 'event TicketCerrado {
    source: Ticket;
    payload {
    id: String;
    }
    trackedFields: [status];
    handlers: [ DashboardService ];
    }'
  - 'event TicketModificado {
    source: Ticket;
    payload {
    id: String;
    prioridad: String;
    }
    trackedFields: [priority];
    }'
  - 'event UsuarioResponde {
    source: Ticket;
    payload {
    id: String;
    respuesta: String;
    }
    handlers: [ WorkflowOrchestrator ];
    }'
  - 'event ManagerAprueba {
    source: Ticket;
    payload {
    id: String;
    resultado: String;
    }
    handlers: [ WorkflowOrchestrator ];
    }'

# ── Decisions (top-level) ──────────────────────────────────────────
# Reglas de decisión

decisions:
  - 'decision PrioridadTicket {
    input: Ticket;
    when Urgente {
    System does notificarAdmin;
    System does asignarPrioritario;
    }
    when Alta {
    System does notificarAdmin;
    System does asignarSiguiente;
    }
    else {
    System does asignarSiguiente;
    }
    }'
